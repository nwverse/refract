name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Pull requests stop superseded checks; main runs must finish to provide a merge-health signal.
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  swift:
    name: Swift build, tests and golden fixtures
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            swift-version: 6.4.2
          - os: macos-26
            swift-version: 6.4.2
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out the sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Select Swift ${{ matrix.swift-version }}
        uses: swift-actions/setup-swift@364295d9c23900ce04d4e5cc708387921b4e50f9 # v3.0.0-beta.1
        with:
          swift-version: ${{ matrix.swift-version }}
      - name: Keep the tool manager's version marker outside the checkout
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f .swift-version ]]; then
            mv .swift-version "$RUNNER_TEMP/refract.swift-version"
          fi
      - name: Show the selected toolchain
        id: swift
        shell: bash
        run: |
          set -euo pipefail
          swift --version
          printf 'bin_path=%s\n' "$(swift build --show-bin-path --disable-automatic-resolution)" >> "$GITHUB_OUTPUT"
      - name: Build with locked dependencies
        run: swift build --disable-automatic-resolution
      - name: Run the complete test suite
        env:
          REFRACT_CLI_PATH: ${{ steps.swift.outputs.bin_path }}/refract
        run: swift test --disable-automatic-resolution
      - name: Test packaging policy and clean source archives
        run: python3 -I scripts/test/test_package_cli.py
      - name: Build and verify the native CLI package
        env:
          REFRACT_PACKAGE_E2E: '1'
          REFRACT_PACKAGE_OUTPUT: ${{ runner.temp }}/refract-cli-package
        run: python3 -I scripts/test/test_package_cli.py PackagingEndToEndTests -v
      - name: Regenerate and compare every golden fixture
        run: |
          swift test --disable-automatic-resolution --skip-build --filter GoldenTests
          git diff --exit-code -- Fixtures
      - name: Reject unexpected generated or dependency files
        shell: bash
        run: |
          set -euo pipefail
          unexpected=$(git status --short --untracked-files=all)
          if [[ -n "$unexpected" ]]; then
            printf 'Unexpected files after build and tests:\n%s\n' "$unexpected"
            exit 1
          fi

  android-compile:
    name: Android generated-code compile gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Select Swift 6.4.2 for the generator CLI
        uses: swift-actions/setup-swift@364295d9c23900ce04d4e5cc708387921b4e50f9 # v3.0.0-beta.1
        with:
          swift-version: 6.4.2
      - name: Keep the tool manager's version marker outside the checkout
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f .swift-version ]]; then
            mv .swift-version "$RUNNER_TEMP/refract.swift-version"
          fi
      - name: Build the generator CLI with locked dependencies
        run: swift build --disable-automatic-resolution
      - name: Check committed native outputs without writing
        run: |
          .build/debug/refract check \
            --input examples/shared/Hello.swift \
            --input examples/shared/NativeComponentScreen.swift \
            --input examples/shared/IdentifiedList.swift \
            --input examples/shared/SettingsScreen.swift \
            --mapping examples/refract.json \
            --android-out examples/android/app/src/main/java/refract/generated \
            --harmony-out examples/harmony/entry/src/main/ets/generated
      - name: Regenerate examples and verify resource catalogs
        run: python3 scripts/check_examples.py
      - name: Select JDK 21 for the Android toolchain
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Install the pinned Android SDK packages
        env:
          ANDROID_COMPILE_SDK: '37.2'
          ANDROID_BUILD_TOOLS: '37.0.0'
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="$RUNNER_TEMP/android-sdk"
          mkdir -p "$sdk_root/cmdline-tools"
          cmdline_version=13114758
          archive="commandlinetools-linux-${cmdline_version}_latest.zip"
          curl --proto '=https' --tlsv1.2 -fsSL \
            "https://dl.google.com/android/repository/${archive}" -o "$RUNNER_TEMP/${archive}"
          printf '%s  %s\n' \
            '7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee' \
            "$RUNNER_TEMP/${archive}" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/${archive}" -d "$sdk_root/cmdline-tools"
          mv "$sdk_root/cmdline-tools/cmdline-tools" "$sdk_root/cmdline-tools/latest"
          {
            echo "ANDROID_HOME=$sdk_root"
            echo "ANDROID_SDK_ROOT=$sdk_root"
          } >> "$GITHUB_ENV"
          echo "$sdk_root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"
          yes | "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk_root" --licenses >/dev/null || true
          "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk_root" \
            "platform-tools" \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"
      - name: Restore the Gradle caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: refract-android-${{ runner.os }}-${{ hashFiles('examples/android/gradle/wrapper/gradle-wrapper.properties', 'examples/android/build.gradle.kts', 'examples/android/app/build.gradle.kts', 'examples/android/settings.gradle.kts') }}
          restore-keys: |
            refract-android-${{ runner.os }}-
      - name: Compile generated Kotlin with the checked-in wrapper
        working-directory: examples/android
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g
        run: ./gradlew --no-daemon :app:compileDebugKotlin
      - name: Stage the canonical fixture corpus through the CLI
        run: python3 scripts/check_fixture_compilation.py
      - name: Compile the canonical fixture corpus
        working-directory: examples/android
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g
        run: ./gradlew --no-daemon :fixtures:compileDebugKotlin
      - name: Render and test the generated settings screen on Native JVM Compose
        working-directory: examples/android
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Publish Native JVM Compose captures and test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-jvm-compose-settings
          path: |
            examples/android/app/build/reports/native-jvm-compose/
            examples/android/app/build/reports/tests/
          if-no-files-found: error
          retention-days: 14
      - name: Reject unexpected files left in the checkout
        shell: bash
        run: |
          set -euo pipefail
          unexpected=$(git status --short --untracked-files=all)
          if [[ -n "$unexpected" ]]; then
            printf 'Unexpected files after the Android compile gate:\n%s\n' "$unexpected"
            exit 1
          fi

  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test the privacy checker in an isolated repository
        run: python3 -I scripts/test/test_privacy_check.py
      - name: Test the documentation checker
        run: python3 -I scripts/test/test_doc_paths.py --self-test
      - name: Check public repository content and paths
        # Hosted CI has the built-in rules; the local hooks additionally use machine-specific private values.
        run: python3 scripts/privacy_check.py
      - name: Test the pull-request issue-link policy
        run: node scripts/test/pr_needs_issue_test.mjs
      - name: Check maintained documentation and repository paths
        run: python3 -I scripts/test/test_doc_paths.py

  workflow-lint:
    name: Lint changed workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out history for the changed-file comparison
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test workflow change selection
        run: python3 -I scripts/changed_workflows.py --event "$GITHUB_EVENT_NAME" --head "$GITHUB_SHA" --self-test
      - name: Lint workflows when they changed
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          selector=(python3 -I scripts/changed_workflows.py --event "$GITHUB_EVENT_NAME" --head "$HEAD_SHA")
          if [[ -n "$BASE_SHA" ]]; then
            selector+=(--base "$BASE_SHA")
          fi
          changed=$("${selector[@]}")
          if [[ -z "$changed" ]]; then
            echo "No workflow changes; actionlint is not needed."
            exit 0
          fi
          mapfile -t workflows <<< "$changed"
          tool_dir=$(mktemp -d "${TMPDIR:-/tmp}/refract-actionlint.XXXXXX")
          trap 'rm -rf "${tool_dir:?}"' EXIT
          version=1.7.10
          base_url="https://github.com/rhysd/actionlint/releases/download/v${version}"
          archive="actionlint_${version}_linux_amd64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL "$base_url/$archive" -o "$tool_dir/$archive"
          checksums="actionlint_${version}_checksums.txt"
          curl --proto '=https' --tlsv1.2 -fsSL "$base_url/$checksums" -o "$tool_dir/$checksums"
          expected=$(python3 - "$tool_dir/$checksums" "$archive" <<'PY'
          import sys
          checksums, archive = sys.argv[1:]
          for line in open(checksums, encoding="ascii"):
              digest, name = line.split()
              if name.removeprefix("*") == archive:
                  print(digest)
                  break
          else:
              raise SystemExit("No checksum for the selected actionlint archive")
          PY
          )
          printf '%s  %s\n' "$expected" "$tool_dir/$archive" | sha256sum --check --strict
          tar -xzf "$tool_dir/$archive" -C "$tool_dir" actionlint
          "$tool_dir/actionlint" -color "${workflows[@]}"
